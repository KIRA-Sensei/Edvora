<style>
:root{--p:#1f5c4a;--ic:#1f5c4a;--p2:color-mix(in srgb,var(--p) 12%,var(--card));--bg:#f6f6f7;--card:#fff;--tx:#17181a;--mu:#62666d;--bd:#e3e4e7;--ok:#2e9e6b;--wa:#d98e1f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-mode="light"]){--bg:#101113;--card:#1a1b1e;--tx:#ececee;--mu:#9a9ea6;--bd:#2c2e33}}
:root[data-mode="dark"]{--bg:#101113;--card:#1a1b1e;--tx:#ececee;--mu:#9a9ea6;--bd:#2c2e33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Nunito,'Noto Sans Devanagari',system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,'Noto Sans Devanagari',Georgia,serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:84px}
.splash,.login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fafafa;z-index:9;padding:24px;text-align:center}
.splash img{width:min(60vw,240px);border-radius:24px;animation:pop .9s ease both}
@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.bar{height:4px;width:140px;background:#d4e4dd;border-radius:4px;margin-top:28px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#1f5c4a;animation:ld 2s linear forwards}
@keyframes ld{to{width:100%}}
.login{background:var(--bg);justify-content:center}
.login img{width:96px;border-radius:22px;margin-bottom:12px}
.login h1{font-size:2rem}.login p{color:var(--mu);margin:6px 0 26px;max-width:30ch}
.sso{display:flex;align-items:center;justify-content:center;gap:12px;width:min(320px,100%);padding:13px;margin:6px 0;border-radius:14px;border:1px solid var(--bd);background:var(--card);font-weight:700}
.sso:hover{border-color:var(--tx)}
.guest{background:var(--p);color:var(--on,#fff);border-color:var(--tx)}
header{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
header img{width:38px;border-radius:10px}header h2{font-size:1.4rem;flex:1}
.pill{background:var(--p2);color:var(--tx);border-radius:20px;padding:4px 12px;font-weight:700;font-size:.85rem}

main{padding:0 16px}
.hero{background:var(--p);color:var(--on,#fff);border-radius:22px;padding:18px;margin:8px 0 14px;display:flex;gap:16px;align-items:center}
.hero b{font-family:Fraunces,serif;font-size:2rem;line-height:1}.hero div{flex:1}.hero small{opacity:.85}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{white-space:nowrap;padding:7px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card)}
.chip.on{background:var(--p);color:var(--on,#fff);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.ph{height:120px;display:flex;align-items:center;justify-content:center;font-size:3rem;background:var(--p2);background-size:cover;background-position:center}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:1.02rem}.mu{color:var(--mu);font-size:.88rem}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:12px;background:var(--p2);color:var(--tx)}

.btn{border:0;background:var(--p);color:var(--on,#fff);font-weight:700;padding:11px 16px;border-radius:12px;margin-top:auto}
.btn:disabled{opacity:.5}
.btn.alt{background:var(--p2);color:var(--tx)}
.row{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.row .ph{width:56px;height:56px;font-size:1.6rem;border-radius:12px;flex:none}.row>div{flex:1;min-width:0}
.steps{display:flex;gap:4px;margin-top:6px}.steps i{flex:1;height:6px;border-radius:4px;background:var(--bd)}.steps i.d{background:var(--ok)}
form{display:grid;gap:12px}
label{font-weight:700;font-size:.9rem;display:grid;gap:5px}
input,select,textarea{padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);width:100%}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;max-width:760px;width:100%}
nav button{flex:1;border:0;background:none;padding:6px 2px;color:var(--mu);font-size:.72rem;font-weight:700;display:grid;justify-items:center}
nav button svg{width:24px;height:24px;color:var(--ic);opacity:.5}nav button.on svg{opacity:1}nav button.on{color:var(--tx)}

.sw{display:flex;gap:12px;flex-wrap:wrap}.sw button{width:46px;height:46px;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:var(--tx)}
.seg{display:flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden}.seg button{flex:1;border:0;background:var(--card);padding:10px}.seg button.on{background:var(--p);color:var(--on,#fff)}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px}
.sec h3{margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:24px;z-index:20;font-weight:700}
dialog{border:0;border-radius:20px;padding:20px;width:min(420px,92vw);background:var(--card);color:var(--tx)}
dialog::backdrop{background:#0008}
.empty{text-align:center;color:var(--mu);padding:36px 10px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bar i{width:100%}.slogan span{opacity:1!important}}

.splash{background:#f6fcf8;transition:opacity .5s ease,transform .5s ease}.splash.out{opacity:0;transform:scale(1.05)}
.splash img{border-radius:0;-webkit-mask-image:none;mask-image:none;width:min(66vw,280px);height:auto}
.slogan{margin:6px 0 0;font:700 1.15rem Fraunces,'Noto Sans Devanagari',Georgia,serif;color:#1d2b57;display:flex;gap:.35em;flex-wrap:wrap;justify-content:center}
.slogan span{opacity:0;animation:rise .6s ease forwards}.splash .bar i{animation-duration:2.7s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pg .card,.pg .row,.pg .sec,.pg .hero,.pg .empty{animation:rise .45s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*50ms)}
.card,.row,.btn,.chip,.sso,.seg button{transition:transform .18s ease,box-shadow .18s ease,background-color .2s,border-color .2s,opacity .2s}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0000001f}.sso:hover,.btn:hover{transform:translateY(-1px)}}
.btn:active,.chip:active,.sso:active,nav button:active{transform:scale(.96)}
nav button svg{transition:transform .28s cubic-bezier(.3,1.6,.5,1),opacity .2s}nav button.on svg{transform:translateY(-3px) scale(1.12)}
.steps i{transition:background-color .5s}
.toast{animation:toast .35s cubic-bezier(.2,1.2,.4,1) backwards}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}}
dialog[open]{animation:dlg .28s cubic-bezier(.2,.9,.3,1)}@keyframes dlg{from{opacity:0;transform:translateY(24px) scale(.97)}}
dialog::backdrop{animation:fade .25s ease}@keyframes fade{from{opacity:0}}
#ml>div:last-child{animation:pop2 .25s ease}@keyframes pop2{from{opacity:0;transform:scale(.9) translateY(6px)}}
.login>*{animation:rise .6s ease backwards}.login>:nth-child(2){animation-delay:.07s}.login>:nth-child(3){animation-delay:.14s}.login>:nth-child(4){animation-delay:.21s}.login>:nth-child(5){animation-delay:.28s}.login>:nth-child(6){animation-delay:.35s}.login>:nth-child(7){animation-delay:.42s}
.bell{position:relative;border:0;background:none;color:var(--ic);padding:6px;display:grid}.bell svg{width:24px;height:24px}
.bell i{position:absolute;top:0;right:0;background:#d64545;color:#fff;font:700 .68rem/1 Nunito,sans-serif;border-radius:10px;padding:3px 6px;font-style:normal}
.bell.ring svg{transform-origin:50% 0;animation:ring 1.2s ease 1}@keyframes ring{0%,100%{transform:rotate(0)}15%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}}
.pill{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style></head><body>

<label>Condition<select name="k">${COND.map(c=>`<option>${c}</option>`).join('')}</select></label>
<button class="btn">Post donation</button></form></div>`,
mine:()=>{const inc=S.items.filter(i=>i.oid===ME),out=S.items.filter(i=>i.cid===ME);
const N={available:0,requested:1,accepted:2,done:3};
const bar=i=>`<div class="steps">${[0,1,2,3].map(k=>`<i class="${N[i.st]>=k?'d':''}"></i>`).join('')}</div>`;
const act2=(a,i,l,c)=>`<button class="btn ${c||''}" data-act="${a}" data-id="${i.id}">${l}</button>`;
const dB=i=>i.st==='requested'?act2('yes',i,'Accept')+act2('no',i,'Decline','alt'):i.st==='accepted'?(i.sOk?'<span class="tag">Waiting for receiver</span>':act2('sent',i,'Confirm handed over')):'';
const rB=i=>i.st==='accepted'?(i.rOk?'<span class="tag">Waiting for sender</span>':act2('recv',i,'Confirm received')):'';
const dT=i=>({available:'Pending: waiting for a request',requested:'Request from '+esc(i.cn||'')+' for '+esc(i.pt||'')+', '+esc(i.sl||''),accepted:'Pickup at '+esc(i.pt||'')+', '+esc(i.sl||''),done:'Completed. Thank you!'})[i.st];
const rT=i=>({requested:'Waiting for the donor to accept',accepted:'Pick up at '+esc(i.pt||'')+', '+esc(i.sl||''),done:'Completed. Enjoy your item!'})[i.st];
const chat=i=>i.cid?act2('chat',i,'Chat'+(un(i.id)?' ('+un(i.id)+')':''),'alt'):'';
const row=(i,t,b)=>`<div class="row">${ph(i)}<div><b>${esc(i.t)}</b><div class="mu">${t}</div>${bar(i)}</div><div style="display:grid;gap:6px">${b}</div></div>`;
return `<h2 style="margin:6px 0 12px">My donations</h2>${inc.map(i=>row(i,dT(i),dB(i)+chat(i))).join('')||'<div class="empty">You have not posted anything yet. Use Donate to list your first item.</div>'}
<h2 style="margin:18px 0 12px">My pickups</h2>${out.map(i=>row(i,rT(i),rB(i)+chat(i))).join('')||'<div class="empty">Claim an item and your pickup shows here.</div>'}`},
 me:()=>{const sw=(cur,at)=>`<div class="sw">${ACC.map(c=>`<button style="background:${c}" class="${cur===c?'on':''}" ${at}="${c}" aria-label="${c}"></button>`).join('')}<input type="color" value="${cur==='match'?S.set.acc:cur}" data-pick="${at}" aria-label="Custom colour" style="width:46px;height:46px;padding:2px"></div>`;
return `<h2 style="margin:6px 0 12px">Settings</h2><div class="sec"><h3>Language</h3><div class="seg"><button class="${S.set.lang!=='hi'?'on':''}" data-lang="en">English</button><button class="${S.set.lang==='hi'?'on':''}" data-lang="hi">हिन्दी</button></div></div><div class="sec"><h3>Appearance</h3><div class="seg">${['auto','light','dark'].map(m=>`<button class="${S.set.mode===m?'on':''}" data-mode="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div></div>
<div class="sec"><h3>Accent colour</h3>${sw(S.set.acc,'data-acc')}</div>
<div class="sec"><h3>Icon colour</h3><div class="seg" style="margin-bottom:12px"><button class="${S.set.ic==='match'?'on':''}" data-ic="match">Match accent</button></div>${sw(S.set.ic,'data-ic')}</div>
<div class="sec"><h3>Notifications</h3><p class="mu">Requests and chat messages alert you in the app. Device alerts also work when Edvora is in the background.</p><button class="btn alt" id="nf">${typeof Notification!=='undefined'&&Notification.permission==='granted'?'Device alerts are on':'Turn on device alerts'}</button></div>
<div class="sec"><h3>Demo data</h3><p class="mu">Removes every item, request and chat message for all devices.</p><button class="btn alt" id="clr">Clear all demo data</button></div><div class="sec"><h3>Account</h3><p class="mu">Signed in as ${esc(S.user)}</p><button class="btn alt" id="out">Sign out</button></div>`}};
 const nav=[['browse','🏠','Browse'],['requests','🙋','Requests'],['donate','➕','Donate'],['mine','📦','Mine'],['me','🎨','Settings']];
 root.innerHTML=`<div id="app"><header><img src="${ICON}" alt=""><h2>Edvora</h2><button class="bell ${ring?'ring':''}" id="bell" aria-label="Notifications">${sv('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>')}${nn?`<i>${nn}</i>`:''}</button><span class="pill">${DB?'Live':'Offline'}: ${esc(NAME)} (${innerWidth>=900?'desktop':'mobile'})</span></header><main class="${ent?'pg':''}">${T[S.tab]()}</main></div>
<nav><div>${nav.map(n=>`<button class="${S.tab===n[0]?'on':''}" data-tab="${n[0]}">${IC[n[0]]}${n[2]}${n[0]==='mine'&&pend+unr?' ('+(pend+unr)+')':''}</button>`).join('')}</div></nav>`;
 wire();tr(root);
 root.querySelectorAll('.pg .card,.pg .row,.pg .sec,.pg .hero,.pg .empty').forEach((e,i)=>e.style.setProperty('--i',Math.min(i,9)));
 if(ent)root.querySelectorAll('.hero b').forEach(b=>{const f=b.textContent,v=parseFloat(f);if(!(v>0))return;const d=f.includes('.')?1:0,t0=performance.now();const st=t=>{const k=Math.min(1,(t-t0)/800);b.textContent=k<1?f.replace(/[\d.]+/,(v*k).toFixed(d)):f;if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)});
}
let photo=null;
function wire(){const $$=(s,f)=>root.querySelectorAll(s).forEach(f);
 $$('[data-tab]',b=>b.onclick=()=>{S.tab=b.dataset.tab;render();scrollTo(0,0)});
 $$('[data-cat]',b=>b.onclick=()=>{S.cat=b.dataset.cat;render()});
 const q=root.querySelector('#q');if(q)q.oninput=()=>{S.q=q.value;const p=q.selectionStart;render();const n=root.querySelector('#q');n.focus();n.setSelectionRange(p,p)};
 $$('[data-claim]',b=>b.onclick=()=>claim(b.dataset.claim));
 $$('[data-lang]',b=>b.onclick=()=>{S.set.lang=b.dataset.lang;save();document.documentElement.lang=b.dataset.lang;render()});
 $$('[data-acc]',b=>b.onclick=()=>{S.set.acc=b.dataset.acc;save();theme();render()});
 $$('[data-ic]',b=>b.onclick=()=>{S.set.ic=b.dataset.ic;save();theme();render()});
 $$('input[data-pick]',i=>i.onchange=()=>{S.set[i.dataset.pick==='data-acc'?'acc':'ic']=i.value;save();theme();render()});
 const nf=root.querySelector('#nf');if(nf)nf.onclick=async()=>{try{await Notification.requestPermission()}catch(e){toast('Alerts are not supported here')}render()};
 $$('[data-mode]',b=>b.onclick=()=>{S.set.mode=b.dataset.mode;save();theme();render()});
 $$('[data-act]',b=>b.onclick=()=>act(b.dataset.act,b.dataset.id));
 $$('[data-del]',b=>b.onclick=()=>{S.reqs=S.reqs.filter(r=>r.id!=b.dataset.del);if(DB)DB.collection('reqs').doc(b.dataset.del).delete().catch(()=>{});render()});
 $$('[data-help]',b=>b.onclick=()=>toast('The requester has been notified'));
 const bl=root.querySelector('#bell');if(bl)bl.onclick=openNotes;
 const clr=root.querySelector('#clr');if(clr)clr.onclick=async()=>{if(!clr.dataset.c){clr.dataset.c=1;clr.textContent=T('Tap again to delete everything');return}try{if(DB)await wipe();S.items=[];S.msgs=[];S.reqs=[];toast('All data cleared');render()}catch(e){toast('Could not clear data')}};
 const out=root.querySelector('#out');if(out)out.onclick=()=>{S.user=null;login()};
 const pf=root.querySelector('#pf');if(pf)pf.onchange=()=>{const f=pf.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,360/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.7)};im.src=URL.createObjectURL(f)};
 const rf=root.querySelector('#rf');if(rf)rf.onsubmit=e=>{e.preventDefault();const f=new FormData(rf);const id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),r={id,t:f.get('t'),g:f.get('g'),by:NAME,oid:ME,at:Date.now()};S.reqs.unshift(r);if(DB)DB.collection('reqs').doc(id).set(r).catch(()=>toast('Could not sync this item'));toast('Request posted');render()};
 const df=root.querySelector('#df');if(df)df.onsubmit=e=>{e.preventDefault();const f=new FormData(df),id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);const it={id,t:f.get('t'),c:f.get('c'),g:f.get('g'),k:f.get('k'),by:NAME,oid:ME,st:'available',img:photo,at:Date.now()};photo=null;S.items.unshift(it);if(DB)DB.collection('items').doc(id).set(it).catch(()=>toast('Could not sync this item'));S.tab='mine';toast(DB?'Posted. Students can claim it now':'Saved on this device only. Open the shared link to sync');render()}}
function claim(id){const it=S.items.find(i=>i.id===id),st={h:4,m:0,pm:true,mode:'h'},pad=n=>String(n).padStart(2,'0');
 const days=[...Array(7)].map((_,k)=>k?k==1?'Tomorrow':new Date(Date.now()+k*864e5).toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'}):'Today');
 const dlg=$(`<dialog><h3>Plan your pickup</h3><p class="mu">${esc(it.t)}</p><form method="dialog" style="gap:12px"><label>Pickup point<select id="pt">${POINTS.map(p=>`<option>${p}</option>`).join('')}</select></label><label>Day<select id="dy">${days.map(p=>`<option>${p}</option>`).join('')}</select></label><div id="hd" style="display:flex;align-items:center;justify-content:center;gap:4px"></div><svg id="dl" viewBox="0 0 200 200" style="width:220px;max-width:100%;margin:auto;touch-action:none"></svg><button class="btn" value="ok">Send request</button><button class="btn alt" value="x">Cancel</button></form></dialog>`);
 document.body.append(dlg);dlg.showModal();tr(dlg);
 const hd=dlg.querySelector('#hd'),dl=dlg.querySelector('#dl');
 const draw=()=>{const h=st.mode==='h',ang=(h?st.h%12*30:st.m*6)*Math.PI/180,x=100+Math.sin(ang)*72,y=100-Math.cos(ang)*72;
  hd.innerHTML=`<button type="button" class="btn ${h?'':'alt'}" data-m="h" style="margin:0;font-size:1.5rem">${st.h}</button><b style="font-size:1.5rem">:</b><button type="button" class="btn ${h?'alt':''}" data-m="m" style="margin:0;font-size:1.5rem">${pad(st.m)}</button><div class="seg" style="margin-left:8px">${['AM','PM'].map(p=>`<button type="button" class="${(p==='PM')===st.pm?'on':''}" data-p="${p}">${p}</button>`).join('')}</div>`;
  let t='';for(let k=0;k<12;k++){const a=k*30*Math.PI/180,sel=h?st.h%12===k:st.m===k*5;t+=`<text x="${100+Math.sin(a)*72}" y="${105-Math.cos(a)*72}" text-anchor="middle" font-size="13" font-weight="700" fill="${sel?'var(--on,#fff)':'var(--tx)'}">${h?(k||12):pad(k*5)}</text>`}
  dl.innerHTML=`<circle cx="100" cy="100" r="96" fill="var(--p2)"/><line x1="100" y1="100" x2="${x}" y2="${y}" stroke="var(--p)" stroke-width="2"/><circle cx="${x}" cy="${y}" r="16" fill="var(--p)"/><circle cx="100" cy="100" r="4" fill="var(--p)"/>`+t;
  hd.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{st.mode=b.dataset.m;draw()});hd.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{st.pm=b.dataset.p==='PM';draw()})};
 const pick=e=>{if(e.type==='pointermove'&&!e.buttons)return;const r=dl.getBoundingClientRect();let a=Math.atan2(e.clientX-r.left-r.width/2,-(e.clientY-r.top-r.height/2))*180/Math.PI;if(a<0)a+=360;if(st.mode==='h')st.h=Math.round(a/30)%12||12;else st.m=Math.round(a/6)%60;draw()};
 dl.onpointerdown=pick;dl.onpointermove=pick;dl.onpointerup=()=>{if(st.mode==='h'){st.mode='m';draw()}};draw();
 dlg.addEventListener('close',()=>{if(dlg.returnValue==='ok'){const sl=dlg.querySelector('#dy').value+', '+st.h+':'+pad(st.m)+' '+(st.pm?'PM':'AM');up(id,{st:'requested',cid:ME,cn:NAME,pt:dlg.querySelector('#pt').value,sl,sOk:false,rOk:false});toast('Request sent to the donor');S.tab='mine';render()}dlg.remove()})}
const saveRead=()=>{try{localStorage.setItem('edvora-read',JSON.stringify(READ))}catch(e){}};
const mineIds=()=>new Set(S.items.filter(i=>i.oid===ME||i.cid===ME).map(i=>i.id));
const un=iid=>S.msgs.filter(m=>m.iid===iid&&m.fid!==ME&&m.at>(READ[iid]||0)).length;
function totalUn(){const ids=mineIds();return [...ids].reduce((n,i)=>n+un(i),0)}
function badge(){const n=totalUn();document.title=(n?'('+n+') ':'')+'Edvora'}
function ping(tx,iid){toast('New message: '+tx.slice(0,50),()=>openChat(iid));try{navigator.vibrate&&navigator.vibrate(120);if(Notification.permission==='granted'&&document.hidden)new Notification('Edvora',{body:tx})}catch(e){}}

 const d=$(`<dialog style="padding:0;height:min(560px,86vh)"><div style="display:flex;flex-direction:column;height:100%"><div style="padding:14px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px"><div><b>${esc(it.t)}</b><div class="mu">Chat with ${esc((it.oid===ME?it.cn:it.by)||'')}</div></div><button class="btn alt" id="cx" style="margin:0">Close</button></div><div id="ml" style="flex:1;overflow:auto;padding:12px;display:grid;gap:8px;align-content:start"></div><form id="mf" style="display:flex;gap:8px;padding:12px;border-top:1px solid var(--bd)"><input id="mi" placeholder="Type a message" autocomplete="off" aria-label="Message"><button class="btn" style="margin:0">Send</button></form></div></dialog>`);
 document.body.append(d);d.showModal();tr(d);
 const draw=()=>{const ms=S.msgs.filter(m=>m.iid===iid).sort((a,b)=>a.at-b.at),l=d.querySelector('#ml');
  l.innerHTML=ms.map(m=>{const me=m.fid===ME;return `<div style="justify-self:${me?'end':'start'};max-width:80%;background:${me?'var(--p)':'var(--p2)'};color:${me?'var(--on,#fff)':'var(--tx)'};padding:8px 12px;border-radius:14px">${esc(m.tx)}<div style="font-size:.7rem;opacity:.7">${new Date(m.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</div></div>`}).join('')||'<div class="empty">'+T('Say hello and agree on the pickup.')+'</div>';
  l.scrollTop=l.scrollHeight;READ[iid]=Math.max(READ[iid]||0,...ms.map(m=>m.at));saveRead();badge()};
 CHAT={iid,draw};draw();
 d.querySelector('#cx').onclick=()=>d.close();
 d.querySelector('#mf').onsubmit=e=>{e.preventDefault();const i=d.querySelector('#mi'),tx=i.value.trim();if(!tx)return;i.value='';const id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),m={id,iid,tx,fid:ME,fn:NAME,at:Date.now()};S.msgs.push(m);if(DB)DB.collection('msgs').doc(id).set(m).catch(()=>toast('Message not synced'));draw()};
 d.addEventListener('close',()=>{CHAT=null;d.remove();render()})}

'Close':'बंद करें','No requests yet. Post what you need and donors will see it.':'अभी कोई अनुरोध नहीं। जो चाहिए वह पोस्ट करें, दाता देखेंगे।','You are all caught up.':'सब देख लिया।','Turn on desktop alerts':'डेस्कटॉप अलर्ट चालू करें','Demo data':'डेमो डेटा','Removes every item, request and chat message for all devices.':'सभी डिवाइस से हर वस्तु, अनुरोध और चैट संदेश हटाता है।','Clear all demo data':'सारा डेमो डेटा मिटाएँ','Tap again to delete everything':'सब कुछ मिटाने के लिए फिर टैप करें','All data cleared':'सारा डेटा मिटा दिया गया','Could not clear data':'डेटा नहीं मिटा','Type a message':'संदेश लिखें','Send':'भेजें','Message':'संदेश','Say hello and agree on the pickup.':'नमस्ते कहें और पिकअप तय करें।',
'Request sent to the donor':'अनुरोध दाता को भेज दिया गया','Posted. Students can claim it now':'पोस्ट हो गया। अब विद्यार्थी इसे माँग सकते हैं','Order completed':'ऑर्डर पूरा हुआ','Could not sync. Check your connection':'सिंक नहीं हुआ। कनेक्शन जाँचें','Message not synced':'संदेश सिंक नहीं हुआ','Could not sync this item':'यह वस्तु सिंक नहीं हुई'};
const hs=x=>x.replace('Today','आज').replace('Tomorrow','कल');
const RX=[[/^New request from (.*?): (.*)$/,(m,n,t)=>n+' का नया अनुरोध: '+t],[/^Pickup booked: (.*)\. Confirm when handed over$/,(m,t)=>'पिकअप तय: '+t+'। सौंपने पर पक्का करें'],[/^Request accepted: (.*)\. Confirm when you receive it$/,(m,t)=>'अनुरोध स्वीकार: '+t+'। मिलने पर पक्का करें'],[/^(\d+) new messages?: (.*)$/,(m,n,t)=>n+' नए संदेश: '+t],[/^Shared by (.*)$/,(m,a)=>a+' ने साझा किया'],[/^Match: (.*)$/,(m,a)=>'मिलान: '+a],[/^(.*) · by (.*)$/,(m,a,b)=>a+' · द्वारा '+b],
[/^(Live|Offline): (.*) \((desktop|mobile)\)$/,(m,a,n,d)=>(a==='Live'?'लाइव':'ऑफ़लाइन')+': '+n+' ('+(d==='desktop'?'डेस्कटॉप':'मोबाइल')+')'],[/^([\d.]+) kg$/,(m,a)=>a+' किग्रा'],
[/^Mine \((\d+)\)$/,(m,a)=>'मेरा ('+a+')'],[/^Chat \((\d+)\)$/,(m,a)=>'चैट ('+a+')'],[/^Chat with (.*)$/,(m,a)=>a+' से चैट'],
[/^Request from (.*) for (.*?), (.*)$/,(m,n,p,t)=>n+' का अनुरोध: '+(HI[p]||p)+', '+hs(t)],[/^Pickup at (.*?), (.*)$/,(m,p,t)=>'पिकअप: '+(HI[p]||p)+', '+hs(t)],[/^Pick up at (.*?), (.*)$/,(m,p,t)=>'पिकअप: '+(HI[p]||p)+', '+hs(t)],
[/^Signed in as (.*)$/,(m,a)=>a+' के रूप में साइन इन'],[/^New request for (.*)$/,(m,a)=>a+' के लिए नया अनुरोध'],[/^Your request was accepted: (.*)$/,(m,a)=>'आपका अनुरोध स्वीकार हुआ: '+a],[/^Order completed: (.*)$/,(m,a)=>'ऑर्डर पूरा हुआ: '+a],[/^New message: (.*)$/,(m,a)=>'नया संदेश: '+a]];
const T=s=>S.set.lang==='hi'&&HI[s]||s;
function tr(el){if(S.set.lang!=='hi')return;
 const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
 ns.forEach(n=>{const v=n.nodeValue,t=v.trim();if(!t)return;let r=HI[t];if(r===undefined)for(const [rx,f] of RX){const m=t.match(rx);if(m){r=f(...m);break}}
  if(r===undefined)return;const p=n.parentNode;if(p&&p.tagName==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',t);n.nodeValue=v.replace(t,()=>r)});
 el.querySelectorAll('[placeholder],[aria-label]').forEach(e=>['placeholder','aria-label'].forEach(a=>{const v=e.getAttribute(a);if(v&&HI[v])e.setAttribute(a,HI[v])}))}
document.documentElement.lang=S.set.lang;
async function wipe(){for(const col of ['items','msgs','reqs']){const q=await DB.collection(col).get();await Promise.all(q.docs.map(d=>DB.collection(col).doc(d.id).delete()))}}
function alertx(m,f){toast(m,f);try{if(Notification.permission==='granted'&&document.hidden)new Notification('Edvora',{body:m})}catch(e){}}
function notes(){const L=[];S.items.forEach(i=>{
 if(i.oid===ME&&i.st==='requested')L.push({id:i.id,tx:'New request from '+i.cn+': '+i.t});
 if(i.oid===ME&&i.st==='accepted'&&!i.sOk)L.push({id:i.id,tx:'Pickup booked: '+i.t+'. Confirm when handed over'});
 if(i.cid===ME&&i.st==='accepted'&&!i.rOk)L.push({id:i.id,tx:'Request accepted: '+i.t+'. Confirm when you receive it'});
 const u=(i.oid===ME||i.cid===ME)?un(i.id):0;if(u)L.push({id:i.id,chat:1,tx:u+(u>1?' new messages: ':' new message: ')+i.t})});return L}
function openNotes(){if(CHAT)return;const L=notes(),can=typeof Notification!=='undefined'&&Notification.permission!=='granted';
 const d=$(`<dialog style="padding:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h3>Notifications</h3><button class="btn alt" id="nx" style="margin:0">Close</button></div>${L.map((n,i)=>`<button class="row" data-n="${i}" style="width:100%;text-align:left"><div>${esc(n.tx)}</div></button>`).join('')||'<div class="empty">You are all caught up.</div>'}${can?'<button class="btn alt" id="np" style="width:100%">Turn on desktop alerts</button>':''}</dialog>`);
 document.body.append(d);d.showModal();tr(d);
 d.querySelector('#nx').onclick=()=>d.close();
 const np=d.querySelector('#np');if(np)np.onclick=async()=>{try{await Notification.requestPermission()}catch(e){toast('Alerts are not supported here')}d.close()};
 d.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const n=L[b.dataset.n];d.close();if(n.chat)openChat(n.id);else{S.tab='mine';render()}});
 d.addEventListener('close',()=>d.remove())}
function up(id,p){const it=S.items.find(i=>i.id===id);if(!it)return;Object.assign(it,p);if(DB)DB.collection('items').doc(id).update(p).catch(()=>toast('Could not sync. Check your connection'));render()}
function act(a,id){const i=S.items.find(x=>x.id===id);if(!i)return;if(a==='chat')return openChat(id);
 if(a==='yes')up(id,{st:'accepted'});
 else if(a==='no')up(id,{st:'available',cid:null,cn:null,pt:null,sl:null,sOk:false,rOk:false});
 else{const p=a==='sent'?{sOk:true}:{rOk:true};if((a==='sent'||i.sOk)&&(a==='recv'||i.rOk)){p.st='done';toast('Order completed')}up(id,p)}}
const busy=()=>{const a=document.activeElement;return document.querySelector('dialog[open]')||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('main'))};
async function startSync(){try{const c=await claude.use('db');if(!c)return;DB=c;
 try{const m=DB.doc('meta/state'),sn=await m.get();if(!sn.exists||sn.data().epoch!=='e2'){await wipe();await m.set({epoch:'e2'})}}catch(e){}
 DB.collection('reqs').onSnapshot(sn=>{S.reqs=sn.docs.map(d=>({...d.data(),id:d.id})).sort((x,y)=>(y.at||0)-(x.at||0));if(S.user&&!busy())render()},()=>{});
 DB.collection('items').onSnapshot(sn=>{const prev=new Map(S.items.map(i=>[i.id,i.st]));
  S.items=sn.docs.map(d=>({...d.data(),id:d.id})).sort((x,y)=>(y.at||0)-(x.at||0));
  sn.docChanges().forEach(ch=>{const i=ch.doc.data(),was=prev.get(ch.doc.id);if(!prev.size||ch.type==='removed')return;
   if(i.oid===ME&&i.st==='requested'&&was!=='requested')alertx('New request for '+i.t,()=>{S.tab='mine';render()});
   if(i.cid===ME&&was==='requested'&&i.st==='accepted')alertx('Your request was accepted: '+i.t);
   if((i.cid===ME||i.oid===ME)&&was&&was!=='done'&&i.st==='done')alertx('Order completed: '+i.t)});
  badge();if(S.user&&!busy())render()},()=>{});
 let first=true;
 DB.collection('msgs').onSnapshot(sn=>{S.msgs=sn.docs.map(d=>({...d.data(),id:d.id}));
  if(!first)sn.docChanges().forEach(ch=>{if(ch.type!=='added')return;const m=ch.doc.data();if(m.fid===ME||!mineIds().has(m.iid)||(CHAT&&CHAT.iid===m.iid))return;ping((m.fn||'')+': '+m.tx,m.iid)});
  first=false;if(CHAT)CHAT.draw();badge();if(S.user&&!busy())render()},()=>{});
 render()}catch(e){}}
try{ME=localStorage.getItem('edvora-id')}catch(e){}
if(!ME){ME='u'+Math.random().toString(36).slice(2,8);try{localStorage.setItem('edvora-id',ME)}catch(e){}}
const root=document.getElementById('root');theme();splash();
</script></body></html>
